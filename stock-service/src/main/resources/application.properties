spring.application.name=stock-service
server.port=8081

spring.kafka.bootstrap-servers=localhost:9091,localhost:9093,localhost:9094
#spring.kafka.bootstrap-servers=kafka1:29092,kafka2:29092,kafka3:29092
spring.kafka.consumer.group-id=stock
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
kafka.topic.order=order_topics


spring.datasource.url=jdbc:mysql://localhost:3306/wikimedia
spring.datasource.username=kafkaUser
spring.datasource.password=favourite1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comment=true
spring.jpa.properties.hibernate.format_sql=true
